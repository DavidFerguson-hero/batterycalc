name: CI

# Runs the API tests and the frontend lint + build on every pull request.
on:
  pull_request:
  workflow_dispatch:   # allow a manual run from the GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (same as api/Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  tariff-checker:
    name: Tariff checker tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (same as the nightly tariff check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API types match the published v2 schema
        run: npm run check:api-types

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://batterysizer-api.onrender.com
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Chromium for the accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Accessibility and phone-width checks (axe, WCAG 2.1 AA)
        run: npm run test:a11y
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Keep the accessibility report if a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-results
          path: frontend/test-results/
          retention-days: 7
