# Local development: API on :8000, frontend on :3000.
# Pass secrets from your shell if you want those features locally:
#   ANTHROPIC_API_KEY (AI summary), EPC_API_TOKEN (postcode lookup on the EPC register).
#
# Postgres and Redis were removed in task 0.6: nothing in the app uses them
# (no accounts or saved results; uploads are processed in memory only).
# Add them back if a future feature needs a database.

services:

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      - ENVIRONMENT=development
      - ANTHROPIC_API_KEY
      - EPC_API_TOKEN
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    # frontend/ has no Dockerfile (Vercel builds it), so run it on the stock Node image.
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
